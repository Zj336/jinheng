name: ci

# ★ 只跑一条命令：selfcheck.py。
#   它不是「顺便再跑一遍」，而是本项目的验收口径本身——
#   demo（端到端场景）+ pytest（单元与安全用例）+ eval_report（对抗评估/沙箱攻击面）。
#   CI 里跑别的组合，就等于对外声明「我们的验收标准不是那个」。
#
# ★ 为什么在 ubuntu 上跑也能代表结果：
#   沙箱那条路径是最依赖操作系统的（进程树、资源限制），代码里已经按
#   sys.platform 分了岔（app/sandbox/runner.py）。CI 在 Linux 上跑通，
#   恰好证明「Windows 上的实现不是唯一实现」，这是加分项而不是风险。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  selfcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 一键自检（demo + pytest + 对抗评估）
        # 一律走 mock：CI 回答的是「系统对不对」，不是「模型今天发挥如何」。
        # 种子数据与演示库都在 selfcheck 内部生成，不需要任何密钥或外部服务。
        env:
          JH_LLM_MODE: mock
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: python selfcheck.py

      - name: 上传自检输出
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfcheck-log
          path: |
            data/*.db
          retention-days: 7
          if-no-files-found: ignore
